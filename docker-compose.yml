version: '3.8'

services:
  elderly-ai-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elderly-ai-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cuda
      - USE_FP16=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./configs:/app/configs
      - ./models:/app/models
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
