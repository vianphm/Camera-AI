# Runtime Inference Configuration

runtime:
  device: "cuda" # cuda or cpu
  use_fp16: true
  engine_type: "auto" # auto (TensorRT -> ONNX -> PyTorch), tensorrt, onnx, openvino, or pytorch
  batch_size: 1
  num_workers: 2
  target_fps: 30
  sync_mode: false
  temporal_device: "cuda"  # ST-Transformer & Autoencoder device ("cuda" = DirectML GPU, or "cpu")
  dml_performance_preference: "high_performance" # DirectML GPU choice: high_performance (discrete GPU), minimum_power (integrated GPU), default (adapter 0)

scheduling:
  enable_tier0_motion_gating: true # Tier-0 Motion Gating (Bypass AI & throttle to 10-15 FPS when room is static)
  pose_stride: 1            # Run single-pass pose + ByteTrack on every camera frame (~30 FPS multi-person tracking)
  temporal_hz: 15.0         # Fixed sampling rate for temporal AI / risk FSM (models & thresholds are calibrated at 15 Hz)
  action_stride: 2          # Run temporal AI every 2 frames (when Gated Trigger is OPEN)
  enable_gated_ai: true     # Bypass AI on normal walking/standing/sitting


display:
  show_ui: true
  window_name: "Fall and Stroke Warning System - Realtime Stream"
  show_bbox: true
  show_skeleton: true
  show_track_id: true
  show_action_label: true
  show_risk_gauge: true
  show_fps_meter: true
  jpeg_quality: 80         # MJPEG web feed quality (encoded on a background thread)
  show_evidence: true

privacy:
  blur_faces: false  # Tắt làm mờ mặt trên giao diện Realtime Stream theo yêu cầu
  blur_kernel_size: 25
  save_snapshots: true
  snapshot_dir: "data/processed/snapshots"
  retention_days: 7
