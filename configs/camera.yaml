# Camera & Input Stream Configuration

source_type: "webcam" # "webcam", "rtsp", "video"

webcam:
  device_index: 0
  width: 1280
  height: 720
  fps: 30
  api_preference: "dshow" # "dshow" on windows, "v4l2" on linux, or "default"

rtsp:
  # - Model: EZVIZ CS-C6N-R105-1L3WF
  # - Số sê-ri (Serial): BF7623187
  # - Mã xác thực (Verification Code): YTUKMP
  # - admin: Tên tài khoản mặc định của camera EZVIZ.
  # - IP_CAMERA: Địa chỉ IP của camera trong mạng WiFi ở nhà (VD: 192.168.1.50).
  # *LƯU Ý QUAN TRỌNG*: Trong App EZVIZ trên điện thoại, phải TẮT tính năng "Mã hóa hình ảnh" (Video Encryption) thì mới xem được RTSP!
  #
  # Link luồng chính (Full HD):
  url: "rtsp://admin:YTUKMP@192.168.1.50:554/Streaming/Channels/101"
  # Hoặc:
  # url: "rtsp://admin:YTUKMP@192.168.1.50:554/h264/ch1/main/av_stream"
  # Link luồng phụ (Sub-stream - Mượt mà, tiết kiệm CPU cho AI):
  # url: "rtsp://admin:YTUKMP@192.168.1.50:554/Streaming/Channels/102"
  reconnect_delay_seconds: 2.0
  max_reconnect_attempts: 10
  buffer_size: 1 # minimal internal buffer to avoid lag

video:
  path: "data/videos/sample_adl_fall.mp4"
  loop: false
  simulate_realtime: true

buffer:
  max_queue_size: 1 # minimal zero-lag queue

# Multi-Camera Configuration (Khả năng mở rộng nhiều camera đồng thời)
multi_camera:
  enabled: false
  cameras:
    - id: "cam_living_room"
      name: "Living Room (Phòng khách)"
      type: "webcam"
      uri: 0
      enabled: true
    - id: "cam_bedroom"
      name: "Bedroom (Phòng ngủ)"
      type: "rtsp"
      uri: "rtsp://admin:password@192.168.1.101:554/stream1"
      enabled: false
    - id: "cam_kitchen"
      name: "Kitchen (Nhà bếp)"
      type: "rtsp"
      uri: "rtsp://admin:password@192.168.1.102:554/stream1"
      enabled: false
